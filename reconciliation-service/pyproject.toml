[tool.poetry]
name = "reconciliation-service"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
packages = [{include = "reconciliation_service", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
"e2a-framework" = { git = "https://github.com/subhamviky/e2a-framework.git", tag = "v1.11.0" }
# E2A's ports on DynamoDB (design note D-02): the line claim and the ledger-retry lease
"e2a-adapters" = { git = "https://github.com/subhamviky/e2a-framework.git", tag = "v1.11.0", subdirectory = "adapters", extras = ["aws", "gcp"] }
# GCP-01: Gemini through the Gemini Developer API (free tier) when E2A_PROVIDER_PROFILE=gemini_api.
# Optional: install with `poetry install --extras gemini` (the image: --build-arg POETRY_EXTRAS=gemini).
"e2a-managed-providers" = { git = "https://github.com/subhamviky/e2a-managed-providers.git", tag = "v0.2.0", extras = ["gemini-api"], optional = true }
"capability-oriented-dsa" = { git = "https://github.com/subhamviky/capability-oriented-dsa.git", tag = "v0.3.0" }
"boto3" = ">=1.34"
"mangum" = ">=0.17"
"httpx" = ">=0.27"
"fastapi" = ">=0.111"
"uvicorn" = { version = ">=0.30", extras = ["standard"] }

[tool.poetry.extras]
gemini = ["e2a-managed-providers"]

[tool.poetry.group.dev.dependencies]
"moto" = { version = ">=5.0", extras = ["dynamodb", "sqs"] }
"jsonschema" = ">=4.22"
"pytest" = ">=8.2"
"httpx" = ">=0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
